<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="70%" stop-color="#0a0515"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#neonPurple)" stroke-width="4" opacity="0.6"/>

  <!-- Concentric Orbital Cyber Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="16 8" opacity="0.5"/>

  <!-- Outer Satellite Bead -->
  <circle cx="390" cy="180" r="10" fill="#22d3ee" filter="url(#glow)"/>

  <!-- Center Hexagonal Cyber Shield -->
  <polygon points="256,120 360,180 360,300 256,360 152,300 152,180" fill="#140a28" stroke="url(#neonCyan)" stroke-width="4" filter="url(#glow)"/>

  <!-- Stylized Cyber "M" for MAYRA -->
  <path d="M 185 305 L 185 200 L 256 265 L 327 200 L 327 305 L 295 305 L 295 245 L 256 282 L 217 245 L 217 305 Z" fill="url(#neonPurple)" filter="url(#glow)"/>

  <!-- Core Quantum Energy Flare -->
  <circle cx="256" cy="256" r="6" fill="#ffffff" filter="url(#glow)"/>

  <!-- Text MAYRA AI -->
  <text x="256" y="420" font-family="'Orbitron', sans-serif, monospace" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8">MAYRA AI</text>
  <text x="256" y="445" font-family="'Rajdhani', sans-serif" font-size="16" font-weight="600" fill="#06b6d4" text-anchor="middle" letter-spacing="3">ANDROID COMPANION</text>
</svg>
